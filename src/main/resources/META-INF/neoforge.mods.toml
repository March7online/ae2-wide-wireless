modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Codex"
displayTest="IGNORE_ALL_VERSION"
description='''
Expands supported AE2 terminals and replaces Wireless Universal Terminal's menu with one native dual workspace: manual crafting and pattern encoding remain visible together.
'''

[[mixins]]
config="ae2_wide_wireless.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
type="required"
versionRange="${ae2_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2wtlib"
type="required"
versionRange="[19.5.1]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19,20)"
ordering="AFTER"
side="CLIENT"
