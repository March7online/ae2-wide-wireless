plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.74'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = neo_version
    mods {
        create(mod_id) {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://modmaven.dev/' }
    maven { url = 'https://modmaven.dev/artifactory/local-releases/' }
    maven { url = 'https://maven.blamejared.com/' }
}

dependencies {
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    compileOnly "de.mari_023:ae2wtlib_api:19.5.1"
    compileOnly "de.mari_023:ae2wtlib:19.5.1"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.27.0.340"
}

tasks.named('processResources', ProcessResources).configure {
    def replacements = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            ae2_version_range      : ae2_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_license            : mod_license,
    ]
    inputs.properties replacements
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replacements
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE')
    exclude('dev/codex/ae2widewireless/mixin/EaepProcessingPanelMixin.class')
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'MixinConfigs'          : 'ae2_wide_wireless.mixins.json',
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
